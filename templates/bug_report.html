{% extends "base.html" %}

{% block title %}Signaler un bug{% endblock %}

{% block content %}
    <section class="card auth-card">
        <p class="eyebrow">Support</p>
        <h1>Signaler un bug</h1>
        <p>Merci de nous aider à améliorer l’application. Décrivez le problème rencontré aussi précisément que possible.</p>

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="description">Description du problème</label>
                <textarea id="description" name="description" rows="10" required placeholder="Expliquez ce qui s’est passé, quand cela est arrivé et la conséquence observée."></textarea>
            </div>

            <div class="form-group">
                <label for="screenshot">Capture d’écran (optionnelle)</label>
                <input id="screenshot" type="file" name="screenshot" accept="image/*">
            </div>

            <input type="hidden" name="browser" id="browser">

            <button type="submit">Envoyer le rapport</button>
        </form>
    </section>

    <script>
        document.getElementById("browser").value = navigator.userAgent;
    </script>
{% endblock %}
