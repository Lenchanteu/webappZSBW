{% extends "base.html" %}

{% block title %}{{ _("Confirm your email") }}{% endblock %}

{% block content %}
    <h1>{{ _("Confirm your email") }}</h1>

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="uname">{{ _("User name") }} :</label>
            <input type="text" id="uname" name="uname" required>
        </div>

        <div class="form-group">
            <label for="pswd">{{ _("Password") }} :</label>
            <input type="password" id="pswd" name="pswd" required>
        </div>

        <button type="submit">{{ _("Submit") }}</button>
    </form>

    <p>{{ _("You don't have an account ?") }} <a href="{{ url_for('register') }}">{{ _("Create one here") }}</a>.</p>
{% endblock %}
