{% extends "base.html" %}

{% block title %}Confirmation de l'adresse e-mail{% endblock %}

{% block content %}
    <h1>Confirmez votre adresse e-mail</h1>

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="uname">Nom d'utilisateur :</label>
            <input type="text" id="uname" name="uname" required>
        </div>

        <div class="form-group">
            <label for="pswd">Mot de passe :</label>
            <input type="password" id="pswd" name="pswd" required>
        </div>

        <button type="submit">Confirmer</button>
    </form>

    <p>Vous n'avez pas encore de compte ? <a href="{{ url_for('register') }}">Inscrivez-vous</a>.</p>
{% endblock %}
